# ===================================
# Configuración de Railway para AeroPro
# ===================================

[build]
builder = "NIXPACKS"
buildCommand = "echo 'Building AeroPro...'"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

